; ============================================================================
;  Example sqli macros file (spec §23)
;
;  Copy to  $SQLI_HOME/.sqli/sqli_macros.ini   (global)
;      and/or  <project>/.sqli/sqli_macros.ini (project)
;
;  Every .sqli/ dir from the cwd up to the root is a layer; closest to the cwd
;  wins per name, so a project may redefine one name the global file sets
;  without copying the rest.  Validate with:  php sqli.php --lint
;  sqli never writes this file. After an edit, reload it in the running app
;  with  /  ->  Macros  ->  r  — the same viewer shows what each name expands
;  to and marks how many arguments it takes.
; ============================================================================
;
;  THE SYNTAX
;
;    name = value        ?name typed on the CLI is replaced by this value
;                        before the statement is split and run. The ? is the
;                        CLI syntax; do NOT write it in this file.
;                        The name ends at the first character that is not a
;                        letter, digit, _ . or - — so `?recent and x = 1` is a
;                        reference followed by more SQL. But because . and -
;                        ARE name characters, ?tbl.id reads the whole of
;                        "tbl.id" as the name and is refused as undefined;
;                        write a macro that includes the qualifier instead.
;
;    '?name'  "?name"    NOT a reference. A ? inside a string literal is left
;                        alone, and that is the whole escape: a query that
;                        really needs the text ?agency is a query that has it
;                        in quotes. It is also why MySQL's own placeholder
;                        survives:  PREPARE s FROM 'SELECT ... WHERE id = ?'
;                        The same goes for a `quoted identifier` and for
;                        anything inside a  -- , #  or  /* */  comment: a
;                        ?name there is text. (/*! ... */ is not a comment --
;                        the server runs it -- so macros DO expand inside it.)
;
;    ?1  ?2  ?3          an argument, numbered from 1. The words after ?name
;                        on the CLI fill them in and are consumed:
;                            ?ganl vegas
;                        Quote an argument to put a space or a ; inside it:
;                            ?ganl "las vegas"
;                        How many words are taken is decided here, by the
;                        highest index the value names.
;                        Unlike a reference, ?1 IS filled inside quotes —
;                        '%?1%' is the ordinary shape for a LIKE.
;
;    ?{name}             ask when the statement runs. The CLI stops and prompts
;                        "name:" and what is typed goes in. The same name twice
;                        is asked once; Esc cancels the whole statement.
;                        ?1 is decided when the line is written; a prompt is
;                        answered when Enter is pressed. Filled inside quotes
;                        too, so '?{from}' works.
;
;    ?other              a value may use other macros, as deep as it goes.
;                        A loop (a uses b uses a) is refused, and is reported
;                        when this file is read as well as at submit time.
;
;  Names may use letters, digits, _ . and -, and must START WITH A LETTER OR _.
;  No leading digit, because that is what keeps ?1 an argument slot and ?name a
;  reference — two shapes, never two readings of one.
;
;  ON THE CLI: a line that ENDS with a complete macro call runs on Enter with no
;  `;` after it — `?who` is a whole thought, and the ; it needs is inside the
;  value. Alt+Enter still means "give me another line".
;  Press ? then Tab for the list of names, each with a slice of its value.
;
;  ONE NAME, ONE VALUE PER ENVIRONMENT
;
;    A section head spelled  [env:NAME]  scopes everything under it to that
;    environment — the one picked with  -E NAME  (or $SQLI_ENV / the config's
;    `envs` block, §16). An agency called the same thing on dev and on prod
;    has two different ids, and this is where that lives:
;
;        [env:dev]
;        fl-agency-id = 22
;
;        [env:prod]
;        fl-agency-id = 1174
;
;    * EVERY OTHER section head is a plain divider and applies everywhere, so
;      nothing becomes environment-specific by accident. `env:` is the switch.
;    * Anything after the env name is a divider too: [env:prod values] and
;      [env:prod clause fragments] are both prod, split up for reading.
;    * Within one file an [env:…] line BEATS an unscoped one of the same name,
;      whichever was written first. Between files the older rule still holds:
;      the closest .sqli/ layer to the cwd wins, scoped or not.
;    * AN ENV THAT `extends` ANOTHER IN sqli_config.json INHERITS ITS MACROS,
;      the same way it inherits that env's options (§16). With
;          "envs": { "base": {...}, "prod": { "extends": "base", ... } }
;      running -E prod loads [env:base] and then [env:prod] over it, so a macro
;      every server shares is written once under the parent and only the ones
;      that really differ are repeated. The whole chain applies, grandparents
;      included, closest env last and therefore winning. The Macros viewer and
;      --lint name the section a value actually came from, so an inherited one
;      reads as [env:base] rather than pretending prod defined it.
;    * WITH NO -E, NO [env:…] SECTION LOADS AT ALL. A session that never said
;      which server it is on cannot be handed prod's id because prod happened
;      to be last in the file; ?fl-agency-id then says which envs define it
;      and asks for an -E. Put the value both under [env:dev] and outside any
;      section if you want a default as well.
;    * --lint lists what loads for the selected env and, separately, what the
;      other envs hold — including a section naming an env no config defines.
;
;  THE FILE FORMAT
;
;    * One macro per line: `name = value`. A value cannot span lines.
;    * `;` starts a comment. `[section]` headers are yours to use as dividers,
;      except `[env:NAME]` — see above.
;    * QUOTE ANY VALUE CONTAINING A SEMICOLON. Outside quotes a `;` starts a
;      comment and the rest of the line is silently lost — and a macro that
;      ends in `;` is the normal case. When in doubt, quote it.
;    * Escapes are not processed inside the quotes, so a value cannot hold both
;      a `;` and a `"`. MySQL quotes with ' and backticks, so this rarely bites;
;      --lint says so if it does.
;    * A NAME WITH NOTHING AFTER THE = IS REFUSED and named when the file is
;      read. It is a line someone started and did not finish, and loaded it
;      would be a macro that expands to nothing at all. A deliberately
;      blank value is different and still fine:  blank = "   "
;    * Values are text exactly as written. `true` is the word true, not 1.
;    * A later line wins over an earlier one with the same name.
;
;  A value may be anything the CLI accepts: an id, a fragment of a WHERE
;  clause, a column list, a table name, or a whole statement — or several,
;  separated by `;`, since sqli splits the expanded text and each statement
;  still faces read-only mode and the dangerous-query confirm on its own.
; ============================================================================

[values]

; No section prefix, so these are true wherever sqli is pointed. The ones that
; differ per server are at the bottom, under [env:…].
fl-agency = agencies

[clause fragments]

recent      = created_at > NOW() - INTERVAL 7 DAY
not-deleted = deleted_at IS NULL
audit-cols  = id, created_at, created_by, updated_at, updated_by

[whole statements]

who = select current_user(), database(), @@hostname

[with arguments]

ganl    = "select * from agencies where name like '%?1%';"
agency  = "select * from agencies where id = ?1;"
cols    = "show full columns from ?1;"
between = "select * from ?1 where created_at between '?2' and '?3';"

[asking when they run]

byagy    = "select * from inspections where agency = ?{agency};"
bydate   = "select * from inspections where inspected_on between '?{from}' and '?{to}';"
findname = "select * from agencies where name like '%?{name}%';"

[built from the ones above]

live-agencies = "select ?audit-cols from ?fl-agency where ?not-deleted;"
new-agencies  = "select ?audit-cols from ?fl-agency where ?recent and ?not-deleted;"

; ============================================================================
;  PER-ENVIRONMENT — everything below loads only for the env that names it.
;  Run with  -E dev  or  -E prod  (§16); with neither, none of it is loaded.
; ============================================================================

[env:dev]

fl-agency-id = 22
agency-db     = devel

[env:prod]

fl-agency-id = 1174
agency-db     = production
prod-host     = database-1.cluster-example.us-east-1.rds.amazonaws.com

[env:prod  the ones to be careful with]

; Scoped and dangerous is the pair worth writing down: this exists on prod
; only, and reads as prod only, wherever it ends up being called from.
todays-inspections = "select * from inspections where inspected_on = curdate();"
